# Lint configuration used locally and in CI (ruff check .)
target-version = "py312"
line-length = 100

# Notebooks are not linted yet. Add them once their outputs are stripped.
extend-exclude = ["notebooks"]

[lint]
# E4/E7/E9 and F are ruff's defaults; I enables import sorting.
select = ["E4", "E7", "E9", "F", "I"]