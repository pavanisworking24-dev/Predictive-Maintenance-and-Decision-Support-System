
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    name: Project Structure and Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema openapi-spec-validator PyYAML

      - name: Verify project structure
        run: |
          test -d backend
          test -d docker
          test -d docs
          test -d frontend
          test -d ml
          test -d rag
          test -d scripts
          test -d tests
          echo "Project structure verified successfully."

      - name: Validate OpenAPI specification
        run: openapi-spec-validator docs/api/openapi.yaml

      - name: Validate OpenAPI YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('docs/api/openapi.yaml', encoding='utf-8')); print('PASS: OpenAPI YAML syntax is valid')"

      - name: Validate Health Summary JSON Schema and example
        run: |
          python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('docs/contracts/health-summary-v0.schema.json', encoding='utf-8')); e=json.load(open('docs/contracts/health-summary-v0.example.json', encoding='utf-8')); Draft202012Validator.check_schema(s); Draft202012Validator(s).validate(e); print('PASS: Health Summary example conforms to schema')"

      - name: Run contract tests
        run: python -m pytest tests/contracts -v
