name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    name: Project Structure and Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML jsonschema openapi-spec-validator

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -d backend
          test -d docker
          test -d docs
          test -d frontend
          test -d ml
          test -d rag
          test -d scripts
          test -d tests

          echo "Project structure verified successfully."

      - name: Verify contract files
        shell: bash
        run: |
          set -e

          required_files=(
            "docs/api/openapi.yaml"
            "docs/contracts/health-summary-v0.schema.json"
            "docs/contracts/health-summary-v0.example.json"
            "tests/contracts/test_health_summary_contract.py"
            "tests/contracts/test_openapi_surface.py"
            ".env.example"
            "docker-compose.yml"
            "scripts/check_db.sh"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              echo "Files tracked under tests/:"
              git ls-tree -r --name-only HEAD | grep '^tests/' || true
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Validate OpenAPI YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('docs/api/openapi.yaml', encoding='utf-8')); print('OpenAPI YAML syntax is valid.')"

      - name: Validate OpenAPI specification
        run: |
          openapi-spec-validator docs/api/openapi.yaml

      - name: Validate Health Summary JSON Schema and example
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = Path("docs/contracts/health-summary-v0.schema.json")
          example_path = Path("docs/contracts/health-summary-v0.example.json")

          with schema_path.open(encoding="utf-8") as file:
              schema = json.load(file)

          with example_path.open(encoding="utf-8") as file:
              example = json.load(file)

          Draft202012Validator.check_schema(schema)

          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = list(validator.iter_errors(example))

          if errors:
              for error in errors:
                  location = ".".join(map(str, error.absolute_path)) or "<root>"
                  print(f"ERROR at {location}: {error.message}")
              raise SystemExit("Health Summary example validation failed.")

          print("Health Summary schema and example validated successfully.")
          PY

      - name: Run contract tests
        run: |
          python -m pytest tests/contracts -v

  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Lint Python code
        # Extend this list as backend/, ml/ and rag/ gain Python code.
        run: |
          ruff check tests

  database-check:
    name: Docker Compose and Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from the example
        run: |
          cp .env.example .env

      - name: Validate the Compose file
        run: |
          docker compose config --quiet

      - name: Start PostgreSQL with pgvector (schema and seed load on first start)
        run: |
          docker compose up -d --wait

      - name: Check schema, pgvector, seed and constraints
        run: |
          bash scripts/check_db.sh

      - name: Show database logs on failure
        if: failure()
        run: |
          docker compose logs postgres

      - name: Stop and remove containers
        if: always()
        run: |
          docker compose down -v