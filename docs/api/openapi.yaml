
openapi: 3.1.0

info:
  title: Conversational Predictive Maintenance API
  version: 0.1.0
  description: >
    Initial REST API contract for the Conversational Predictive
    Maintenance and Decision Support System. The platform uses
    NASA C-MAPSS simulated engine data to estimate Remaining Useful
    Life (RUL), assess risk, explain predictions, and provide
    maintenance decision support. This contract describes the planned
    API and does not imply every endpoint is implemented.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Placeholder for future deployment

tags:
  - name: Machines
    description: Machine inventory and machine details
  - name: Sensor Readings
    description: Historical sensor observations from the dataset
  - name: Predictions
    description: RUL predictions and prediction history
  - name: Health Summary
    description: Combined machine health and decision-support information

paths:
  /machines:
    get:
      tags: [Machines]
      summary: List machines
      operationId: listMachines
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            type: string
            enum: [FD001, FD002, FD003, FD004]
          description: Filter machines by C-MAPSS subset.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Machine list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Machines]
      summary: Get machine details
      operationId: getMachine
      responses:
        "200":
          description: Machine details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/sensor-readings:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Sensor Readings]
      summary: Get historical sensor readings
      operationId: getSensorReadings
      description: >
        Returns stored cycle-based observations from the C-MAPSS
        dataset. This is not a live telemetry ingestion endpoint.
      parameters:
        - name: cycle_from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: cycle_to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Historical readings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [machine_id, readings]
                properties:
                  machine_id:
                    $ref: "#/components/schemas/MachineCode"
                  readings:
                    type: array
                    items:
                      $ref: "#/components/schemas/SensorReading"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/predictions:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Predictions]
      summary: Get machine prediction history
      operationId: getPredictionHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Prediction history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [machine_id, predictions]
                properties:
                  machine_id:
                    $ref: "#/components/schemas/MachineCode"
                  predictions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Prediction"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /predictions:
    post:
      tags: [Predictions]
      summary: Generate a machine RUL prediction
      operationId: createPrediction
      description: >
        Requests a prediction for a machine at a specified observed
        cycle using an available model. The backend stores the result
        and associated uncertainty and risk information when available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionRequest"
      responses:
        "201":
          description: Prediction generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/health-summary:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Health Summary]
      summary: Get the latest machine health summary
      operationId: getHealthSummary
      description: >
        Returns a combined summary of the latest available RUL estimate,
        uncertainty interval, risk assessment, and leading SHAP
        contributors. Optional properties may be omitted when their
        corresponding capability or result is unavailable. Decision
        support is research-oriented and based on simulated C-MAPSS data.
      responses:
        "200":
          description: Health summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    MachineId:
      name: machine_id
      in: path
      required: true
      description: >
        Readable machine identifier, such as FD001-E047. The corresponding
        internal database UUID is not exposed as this public identifier.
      schema:
        $ref: "#/components/schemas/MachineCode"

  schemas:
    MachineCode:
      type: string
      pattern: '^FD00[1-4]-E[0-9]{3}$'
      examples: ["FD001-E047"]
      description: >
        Public, readable machine identifier formed from the C-MAPSS
        subset and engine number. Adjust the pattern if supported engine
        identifiers can exceed three digits.

    Machine:
      type: object
      required: [machine_id, dataset_id, engine_id]
      properties:
        machine_id:
          $ref: "#/components/schemas/MachineCode"
        dataset_id:
          type: string
          enum: [FD001, FD002, FD003, FD004]
        engine_id:
          type: integer
          minimum: 1
        latest_cycle:
          type: [integer, "null"]
          minimum: 1
        created_at:
          type: string
          format: date-time
          description: Application-generated creation timestamp in UTC.

    MachineListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    SensorReading:
      type: object
      required: [cycle, operating_settings, sensors]
      properties:
        cycle:
          type: integer
          minimum: 1
          description: Cycle index from the C-MAPSS observation.
        operating_settings:
          type: array
          description: The three C-MAPSS operating settings.
          minItems: 3
          maxItems: 3
          items:
            type: number
        sensors:
          type: object
          description: Sensor values keyed by sensor name.
          additionalProperties:
            type: number
          examples:
            - sensor_1: 518.67
              sensor_2: 641.82
        recorded_at:
          type: [string, "null"]
          format: date-time
          description: >
            Optional application-recorded timestamp in UTC. C-MAPSS
            cycle data does not supply a real-world calendar timestamp.

    PredictionRequest:
      type: object
      required: [machine_id, cycle]
      properties:
        machine_id:
          $ref: "#/components/schemas/MachineCode"
        cycle:
          type: integer
          minimum: 1
          description: Observed cycle at which to estimate RUL.
        model_version_id:
          type: [string, "null"]
          format: uuid
          description: >
            Optional internal model-version UUID. The server selects the
            active model version if this property is omitted.

    Prediction:
      type: object
      required:
        - prediction_id
        - machine_id
        - cycle
        - rul_estimate
        - model_version
        - created_at
      properties:
        prediction_id:
          type: string
          format: uuid
        machine_id:
          $ref: "#/components/schemas/MachineCode"
        cycle:
          type: integer
          minimum: 1
        rul_estimate:
          type: number
          minimum: 0
          description: Estimated remaining useful life in cycles.
        rul_interval:
          oneOf:
            - $ref: "#/components/schemas/RULInterval"
            - type: "null"
          description: Optional conformal interval when available.
        at_cap:
          type: boolean
          description: >
            True when the displayed RUL is subject to the training-label
            cap convention. It does not mean the engine has exactly the
            cap number of cycles remaining.
        risk_level:
          type: [string, "null"]
          enum: [LOW, MEDIUM, HIGH, null]
          description: Optional risk classification when available.
        model_version:
          type: string
        created_at:
          type: string
          format: date-time
          description: Application-generated prediction timestamp in UTC.

    RULInterval:
      type: object
      required: [lower_bound, upper_bound, coverage_level]
      properties:
        lower_bound:
          type: number
          minimum: 0
        upper_bound:
          type: number
          minimum: 0
        coverage_level:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: >
            Nominal conformal prediction coverage, for example 0.90.
            This is not a guarantee for every individual prediction.

    RULThresholdProbability:
      type: object
      required: [threshold_cycles, probability]
      properties:
        threshold_cycles:
          type: integer
          minimum: 1
          description: RUL threshold in cycles.
        probability:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Estimated probability that RUL is less than or equal to
            threshold_cycles. This is not a guaranteed real-world
            failure probability.
        method:
          type: string
          description: Estimation method, when available.
          examples: ["calibration-residual estimate"]

    RiskAssessment:
      type: object
      required: [level, thresholds_version]
      properties:
        level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        thresholds_version:
          type: string

    SHAPContributor:
      type: object
      required: [feature, shap_value]
      properties:
        feature:
          type: string
          description: >
            Raw sensor or engineered feature name, such as
            sensor_11_rolling_mean_5.
        shap_value:
          type: number
          description: SHAP value for this feature in the explained model output.
        effect_on_rul:
          type: string
          enum:
            - increases_estimated_rul
            - decreases_estimated_rul
            - not_interpreted
          description: >
            Optional human-readable interpretation. Populate only when
            the SHAP output semantics and direction have been validated.

    EvidenceReference:
      type: object
      required: [type, reference]
      properties:
        type:
          type: string
          enum: [dataset, model, prediction, data_record]
        reference:
          type: string
          description: Stable identifier or reference for the evidence.
        description:
          type: string

    HealthSummary:
      type: object
      required:
        - machine_id
        - dataset_id
        - cycle
        - model_version
        - rul
        - risk
        - generated_at
        - disclaimer
      properties:
        machine_id:
          $ref: "#/components/schemas/MachineCode"
        dataset_id:
          type: string
          enum: [FD001, FD002, FD003, FD004]
        cycle:
          type: integer
          minimum: 1
        model_version:
          type: string
        rul:
          type: object
          required: [estimate]
          properties:
            estimate:
              type: number
              minimum: 0
              description: Estimated remaining useful life in cycles.
            interval:
              oneOf:
                - $ref: "#/components/schemas/RULInterval"
                - type: "null"
              description: Optional uncertainty interval when available.
            at_cap:
              type: boolean
              description: >
                True when the displayed estimate is subject to the
                training-label cap convention.
        rul_threshold_probability:
          oneOf:
            - $ref: "#/components/schemas/RULThresholdProbability"
            - type: "null"
          description: Optional until estimation and evaluation are implemented.
        risk:
          $ref: "#/components/schemas/RiskAssessment"
        trend:
          type: string
          description: Brief recent RUL or sensor trend, when available.
        top_contributors:
          type: array
          items:
            $ref: "#/components/schemas/SHAPContributor"
          description: Leading SHAP contributors, when available.
        recommended_investigation:
          type: array
          items:
            type: string
          description: >
            Optional research-oriented guidance, not an authoritative
            maintenance procedure.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
          description: >
            Optional references supporting the model output or data context.
            Retrieved-document citations for assistant answers belong in
            the conversational response contract.
        generated_at:
          type: string
          format: date-time
          description: >
            Time when the application generated the Health Summary.
            Emit in UTC using ISO 8601.
        disclaimer:
          type: string
          description: >
            Research disclaimer explaining the limits of simulated-data
            decision support.
          examples:
            - Research-oriented decision support based on simulated C-MAPSS data and retrieved technical knowledge.

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          examples: ["NOT_FOUND"]
        message:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested machine or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
