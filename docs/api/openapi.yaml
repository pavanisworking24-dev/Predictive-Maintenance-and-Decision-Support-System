openapi: 3.0.3

info:
  title: Conversational Predictive Maintenance API
  version: 0.1.0
  description: >
    REST API contract for the Conversational Predictive Maintenance and
    Decision Support System. The platform uses NASA C-MAPSS simulated
    engine data to estimate Remaining Useful Life (RUL), assess risk,
    explain predictions, and provide research-oriented maintenance
    decision support. This contract describes the planned API and does
    not imply that every endpoint is implemented.

    Authentication: every endpoint except POST /auth/login and GET /health
    requires a JWT bearer token. Role-restricted operations list their
    allowed roles in the x-allowed-roles extension and return 403 for other
    roles; operations without it are open to all authenticated roles
    (ADMIN, MAINTENANCE_MANAGER, MAINTENANCE_ENGINEER).

    Administration (users, model versions, knowledge base, operational
    metrics) is limited to ADMIN; creating a new risk threshold
    configuration is also ADMIN only, while every role may read the
    thresholds and the fleet report.

    Paths differ from the first scope draft as follows:
    GET /machines/{machine_id}/sensor-readings replaces
    GET /machines/{id}/history, and
    GET /machines/{machine_id}/predictions replaces
    GET /predictions/{machine_id}.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Placeholder for future deployment

tags:
  - name: Machines
    description: Machine inventory and machine details
  - name: Sensor Readings
    description: Historical cycle-based sensor observations
  - name: Predictions
    description: RUL predictions and prediction history
  - name: Health Summary
    description: Combined machine health and decision-support information
  - name: Authentication
    description: Login and access tokens
  - name: Risk
    description: Fleet risk view
  - name: Explanation
    description: SHAP explanations of model predictions
  - name: Maintenance
    description: Maintenance records
  - name: Alerts
    description: Risk alerts and their acknowledgement
  - name: Assistant
    description: Conversational decision-support assistant
  - name: Platform
    description: Service health and operational metrics
  - name: Administration
    description: Users, risk thresholds, model versions and the knowledge base (Admin only, except reading thresholds)
  - name: Reports
    description: Fleet report

security:
  - bearerAuth: []

paths:
  /machines:
    get:
      tags: [Machines]
      summary: List machines
      operationId: listMachines
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetId"
          description: Filter machines by C-MAPSS dataset subset.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Machine list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Machines]
      summary: Get machine details
      operationId: getMachine
      responses:
        "200":
          description: Machine details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/sensor-readings:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Sensor Readings]
      summary: Get historical sensor readings
      operationId: getSensorReadings
      description: >
        Returns stored cycle-based observations from C-MAPSS.
        This is not a live telemetry ingestion endpoint.
      parameters:
        - name: cycle_from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: cycle_to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Historical readings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorReadingListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/predictions:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Predictions]
      summary: Get machine prediction history
      operationId: getPredictionHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Prediction history retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /predictions:
    post:
      tags: [Predictions]
      summary: Generate a machine RUL prediction
      operationId: createPrediction
      description: >
        Requests an RUL prediction for a registered machine at a specified
        observed cycle. The backend uses the available model and its
        preprocessing pipeline. The result is stored when persistence
        is configured. Uncertainty and risk information are included
        only when available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionRequest"
      responses:
        "201":
          description: Prediction generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /machines/{machine_id}/health-summary:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Health Summary]
      summary: Get the latest machine health summary
      operationId: getHealthSummary
      description: >
        Returns the latest available RUL estimate and, when implemented,
        its conformal prediction interval, risk level, trend, SHAP
        contributors, threshold estimate, and decision-support
        recommendation. Optional fields are omitted when unavailable.
        This is research-oriented decision support based on simulated
        C-MAPSS data and retrieved technical knowledge.
      responses:
        "200":
          description: Health summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      tags: [Platform]
      summary: Service health check
      operationId: getHealth
      description: >
        Liveness and readiness check for Docker, CI and monitoring.
        No authentication is required.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain an access token
      operationId: login
      description: >
        Exchanges email and password for a JWT bearer token. The token
        carries the user's role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /risk:
    get:
      tags: [Risk]
      summary: List the latest risk assessment per machine
      operationId: listRisk
      description: >
        Fleet view for the dashboard: the latest stored risk result for
        each machine, optionally filtered by dataset and risk level.
        Risk probabilities are model-derived estimates, not real-world
        failure probabilities.
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetId"
        - name: risk_level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Risk list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /risk/high:
    get:
      tags: [Risk]
      summary: List machines currently at HIGH risk
      operationId: listHighRisk
      description: Same item shape as GET /risk, restricted to the HIGH risk level.
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: High-risk machines retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /machines/{machine_id}/explanation:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Explanation]
      summary: Get the SHAP explanation for a machine
      operationId: getExplanation
      description: >
        Returns the top SHAP contributors for the latest prediction, or for
        the requested cycle when a stored explanation exists. SHAP describes
        model behaviour; it does not establish a physical cause.
      parameters:
        - name: cycle
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Observed cycle; defaults to the latest explained cycle.
      responses:
        "200":
          description: Explanation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplanationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /maintenance:
    get:
      tags: [Maintenance]
      summary: List maintenance records
      operationId: listMaintenance
      parameters:
        - name: machine_id
          in: query
          required: false
          schema:
            type: string
            example: FD001-E047
          description: Filter by public machine identifier.
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaintenanceStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Maintenance records retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Maintenance]
      summary: Create a maintenance record
      operationId: createMaintenance
      x-allowed-roles: [ADMIN, MAINTENANCE_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceCreate"
      responses:
        "201":
          description: Maintenance record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /maintenance/{maintenance_id}:
    parameters:
      - $ref: "#/components/parameters/MaintenanceId"
    put:
      tags: [Maintenance]
      summary: Update a maintenance record
      operationId: updateMaintenance
      description: >
        Fields that are omitted are left unchanged. completed_at must not be
        earlier than scheduled_at.
      x-allowed-roles: [ADMIN, MAINTENANCE_ENGINEER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdate"
      responses:
        "200":
          description: Maintenance record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      operationId: listAlerts
      description: >
        Alerts are created automatically when a machine's risk level changes
        to HIGH or its predicted RUL falls below the configured threshold.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: machine_id
          in: query
          required: false
          schema:
            type: string
            example: FD001-E047
          description: Filter by public machine identifier.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /alerts/{alert_id}:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    patch:
      tags: [Alerts]
      summary: Acknowledge, resolve or assign an alert
      operationId: updateAlert
      description: >
        Setting status to ACKNOWLEDGED or RESOLVED records the acting user
        and the time. assigned_to is a user id; send null to unassign.
      x-allowed-roles: [ADMIN, MAINTENANCE_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertUpdate"
      responses:
        "200":
          description: Alert updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /chat:
    post:
      tags: [Assistant]
      summary: Ask the conversational assistant
      operationId: createChatMessage
      description: >
        The answer is grounded in the machine's Machine Health Summary (when
        machine_id is given) and retrieved knowledge-base passages, and
        distinguishes model output, retrieved knowledge and uncertainty.
        Every response carries the research disclaimer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /chat/sessions:
    get:
      tags: [Assistant]
      summary: List the current user's chat sessions
      operationId: listChatSessions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Chat sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /metrics:
    get:
      tags: [Platform]
      summary: Operational metrics
      operationId: getMetrics
      description: >
        Basic monitoring: request counts, error counts and API latency
        percentiles since the service started.
      x-allowed-roles: [ADMIN]
      responses:
        "200":
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /reports/fleet:
    get:
      tags: [Reports]
      summary: Fleet report
      operationId: getFleetReport
      description: >
        Counts per risk level, RUL statistics and open alerts for the fleet,
        optionally for one dataset, using the active risk threshold
        configuration. All roles may read it.
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetId"
        - name: top
          in: query
          required: false
          description: Number of highest-risk machines to list.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Report generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /thresholds:
    get:
      tags: [Administration]
      summary: List risk threshold configurations
      operationId: listThresholds
      description: >
        All versions, newest first, and the version that is currently active.
        Readable by every role so that screens can show which thresholds
        produced a risk level.
      responses:
        "200":
          description: Configurations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdConfigListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      summary: Create and activate a new risk threshold configuration
      operationId: createThresholdConfig
      description: >
        Versions are immutable. Creating a configuration makes it the active
        one; earlier versions stay available because stored risk scores refer
        to them.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThresholdConfigCreate"
      responses:
        "201":
          description: Configuration created and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      tags: [Administration]
      summary: List users
      operationId: listUsers
      x-allowed-roles: [ADMIN]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      summary: Create a user
      operationId: createUser
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Administration]
      summary: Update a user (role, active flag, name or password)
      operationId: updateUser
      description: Deactivate a user with is_active=false instead of deleting the account.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /models:
    get:
      tags: [Administration]
      summary: List registered model versions
      operationId: listModelVersions
      x-allowed-roles: [ADMIN]
      parameters:
        - name: dataset_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Model versions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelVersionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /models/{model_version_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ModelVersionId"
    post:
      tags: [Administration]
      summary: Activate a model version
      operationId: activateModelVersion
      description: >
        Makes this version the active one for its dataset; the previously
        active version of that dataset is deactivated in the same step.
      x-allowed-roles: [ADMIN]
      responses:
        "200":
          description: Model version activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /knowledge/documents:
    get:
      tags: [Administration]
      summary: List knowledge-base documents
      operationId: listKnowledgeDocuments
      x-allowed-roles: [ADMIN]
      parameters:
        - name: ingestion_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IngestionStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      summary: Upload a knowledge-base document
      operationId: uploadKnowledgeDocument
      description: >
        Stores the document and queues it for ingestion (parsing, chunking,
        embedding). The response is 202 with status PENDING; poll the list
        endpoint for INGESTED or FAILED.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentUpload"
      responses:
        "202":
          description: Document accepted for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /knowledge/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    delete:
      tags: [Administration]
      summary: Delete a knowledge-base document and its chunks
      operationId: deleteKnowledgeDocument
      x-allowed-roles: [ADMIN]
      responses:
        "204":
          description: Document deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from POST /auth/login.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    MaintenanceId:
      name: maintenance_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelVersionId:
      name: model_version_id
      in: path
      required: true
      description: Internal model version id (model_versions.id).
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MachineId:
      name: machine_id
      in: path
      required: true
      description: >
        Public readable machine identifier, for example FD001-E047.
        The database internal UUID is not exposed as this identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 50
        pattern: "^[A-Za-z0-9_-]+$"
        example: FD001-E047

  schemas:
    DatasetId:
      type: string
      enum: [FD001, FD002, FD003, FD004]

    Machine:
      type: object
      additionalProperties: false
      required:
        - machine_id
        - dataset_id
        - engine_id
      properties:
        machine_id:
          type: string
          description: Public readable machine identifier.
          example: FD001-E047
        dataset_id:
          $ref: "#/components/schemas/DatasetId"
        engine_id:
          type: integer
          minimum: 1
          description: Engine identifier within the dataset subset.
        latest_cycle:
          type: integer
          minimum: 1
          description: Most recent available cycle, when readings exist.
        created_at:
          type: string
          format: date-time
          description: Application-generated UTC creation timestamp.

    MachineListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    SensorReading:
      type: object
      additionalProperties: false
      required: [cycle, operating_settings, sensors]
      properties:
        cycle:
          type: integer
          minimum: 1
          description: Observed engine cycle, not a wall-clock timestamp.
        operating_settings:
          type: array
          description: The three C-MAPSS operating settings.
          minItems: 3
          maxItems: 3
          items:
            type: number
        sensors:
          type: object
          description: Sensor values keyed by sensor name.
          minProperties: 1
          additionalProperties:
            type: number
          example:
            sensor_1: 518.67
            sensor_2: 641.82
        recorded_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional application ingestion timestamp. C-MAPSS does not
            provide a real-world timestamp for each observation.

    SensorReadingListResponse:
      type: object
      additionalProperties: false
      required: [machine_id, readings]
      properties:
        machine_id:
          type: string
          example: FD001-E047
        readings:
          type: array
          items:
            $ref: "#/components/schemas/SensorReading"

    PredictionRequest:
      type: object
      additionalProperties: false
      required: [machine_id, cycle]
      properties:
        machine_id:
          type: string
          example: FD001-E047
          description: Public readable machine identifier.
        cycle:
          type: integer
          minimum: 1
          description: >
            Observed cycle at which to estimate RUL. Required sensor
            readings and feature history must be available.
        model_version_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional internal model-version UUID. If omitted, the server
            selects the configured active model version.

    RULInterval:
      type: object
      additionalProperties: false
      description: >
        Conformal prediction interval. The application must validate
        that upper_bound is greater than or equal to lower_bound.
      required: [lower_bound, upper_bound, coverage_level]
      properties:
        lower_bound:
          type: number
          minimum: 0
        upper_bound:
          type: number
          minimum: 0
        coverage_level:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          exclusiveMaximum: true
          description: >-
            Nominal conformal coverage (strictly between 0 and 1),
            not a per-prediction guarantee.

    Prediction:
      type: object
      additionalProperties: false
      required:
        - prediction_id
        - machine_id
        - cycle
        - predicted_rul
        - model_version
        - created_at
      properties:
        prediction_id:
          type: integer
          format: int64
          minimum: 1
          description: >
            Identifier of the prediction record (predictions.id, a
            BIGSERIAL in the database).
          example: 1042
        machine_id:
          type: string
          example: FD001-E047
        cycle:
          type: integer
          minimum: 1
        predicted_rul:
          type: number
          minimum: 0
          description: Estimated remaining useful life in cycles.
        rul_interval:
          $ref: "#/components/schemas/RULInterval"
        model_version:
          type: string
          description: Version of the model used for this prediction.
        created_at:
          type: string
          format: date-time
          description: Application-generated UTC prediction timestamp.

    PredictionListResponse:
      type: object
      additionalProperties: false
      required: [machine_id, predictions]
      properties:
        machine_id:
          type: string
          example: FD001-E047
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/Prediction"

    RULEstimate:
      type: object
      additionalProperties: false
      required: [estimate, at_cap]
      properties:
        estimate:
          type: number
          minimum: 0
          description: Estimated remaining useful life in cycles.
        interval:
          $ref: "#/components/schemas/RULInterval"
        at_cap:
          type: boolean
          description: >
            True when the displayed estimate is subject to the configured
            RUL label cap. This does not mean the actual RUL equals the cap.

    RULThresholdProbability:
      type: object
      additionalProperties: false
      description: >
        Optional; omit when unavailable. Include only after the estimation
        method has been implemented and evaluated.
      required: [threshold_cycles, probability]
      properties:
        threshold_cycles:
          type: integer
          minimum: 1
          description: RUL threshold used for the estimate.
        probability:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Estimated probability that RUL is at or below threshold_cycles.
            This is not a real-world failure probability.

    SHAPContributor:
      type: object
      additionalProperties: false
      required: [feature, shap_value]
      properties:
        feature:
          type: string
          minLength: 1
          description: >
            Model input feature, including raw sensors and engineered
            features such as rolling statistics.
        shap_value:
          type: number
          description: SHAP contribution in the explanation space.
        effect_on_rul:
          type: string
          enum:
            - increases_estimated_rul
            - decreases_estimated_rul
            - direction_not_mapped
          description: >
            Include a directional interpretation only when its mapping
            has been implemented and validated.

    Recommendation:
      type: object
      additionalProperties: false
      description: Optional decision-support recommendation.
      required: [summary, rule_id]
      properties:
        summary:
          type: string
          minLength: 1
          description: Concise research-oriented decision-support guidance.
        rule_id:
          type: string
          minLength: 1
          description: Identifier of the decision rule that produced the guidance.

    HealthSummary:
      type: object
      additionalProperties: false
      required:
        - machine_id
        - dataset_id
        - cycle
        - model_version
        - rul
        - generated_at
        - disclaimer
      properties:
        machine_id:
          type: string
          example: FD001-E047
          description: Public readable machine identifier.
        dataset_id:
          $ref: "#/components/schemas/DatasetId"
        cycle:
          type: integer
          minimum: 1
          description: Observed cycle for this summary.
        model_version:
          type: string
          minLength: 1
          description: Model version used for the RUL estimate.
        rul:
          $ref: "#/components/schemas/RULEstimate"
        rul_threshold_probability:
          $ref: "#/components/schemas/RULThresholdProbability"
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: >
            Risk band from the configured risk rules. Include only when
            risk assessment has been implemented and is available.
        thresholds_version:
          type: string
          minLength: 1
          example: cfg-2
          description: >
            Version of the risk-threshold configuration that produced
            risk_level. Present if and only if risk_level is present.
        trend:
          type: string
          enum: [improving, stable, degrading, unknown]
          description: Recent RUL or sensor trend; omit when unavailable.
        top_contributors:
          type: array
          description: >
            Leading SHAP contributors, when a valid explanation is available.
            SHAP describes model behavior, not physical causation.
          items:
            $ref: "#/components/schemas/SHAPContributor"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        generated_at:
          type: string
          format: date-time
          description: Application-generated UTC timestamp for this summary.
        disclaimer:
          type: string
          description: Required research-use disclaimer.
          example: >-
            Research-oriented decision support based on simulated C-MAPSS
            data and retrieved technical knowledge.

    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    AlertStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED]

    MaintenanceStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]

    UserRole:
      type: string
      enum: [ADMIN, MAINTENANCE_MANAGER, MAINTENANCE_ENGINEER]

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
        model_loaded:
          type: boolean
        version:
          type: string
          example: 0.1.0

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, role]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.
        role:
          $ref: "#/components/schemas/UserRole"

    RiskSummaryItem:
      type: object
      additionalProperties: false
      required: [machine_id, dataset_id, cycle, rul_estimate, at_cap, risk_level]
      properties:
        machine_id:
          type: string
          example: FD001-E047
        dataset_id:
          $ref: "#/components/schemas/DatasetId"
        cycle:
          type: integer
          minimum: 1
        rul_estimate:
          type: number
          minimum: 0
          description: Estimated remaining useful life in cycles.
        at_cap:
          type: boolean
          description: >
            True when the estimate is subject to the RUL label cap; the UI
            shows it as at or above the cap, not as an exact value.
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        thresholds_version:
          type: string
          example: cfg-2
        rul_threshold_probability:
          $ref: "#/components/schemas/RULThresholdProbability"

    RiskListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RiskSummaryItem"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    SensorContribution:
      type: object
      additionalProperties: false
      required: [sensor, shap_value]
      properties:
        sensor:
          type: string
          example: sensor_11
        shap_value:
          type: number
          description: Sum of the SHAP values of this sensor's features.

    ExplanationResponse:
      type: object
      additionalProperties: false
      required: [machine_id, cycle, model_version, contributors]
      properties:
        machine_id:
          type: string
          example: FD001-E047
        cycle:
          type: integer
          minimum: 1
        model_version:
          type: string
        contributors:
          type: array
          description: Top feature-level SHAP contributors, largest first.
          items:
            $ref: "#/components/schemas/SHAPContributor"
        sensor_contributions:
          type: array
          description: Contributions aggregated to sensor level.
          items:
            $ref: "#/components/schemas/SensorContribution"
        generated_at:
          type: string
          format: date-time

    MaintenanceRecord:
      type: object
      additionalProperties: false
      required: [maintenance_id, machine_id, created_by, title, status, created_at]
      properties:
        maintenance_id:
          type: integer
          format: int64
          minimum: 1
        machine_id:
          type: string
          example: FD001-E047
        created_by:
          type: string
          format: uuid
          description: Id of the user who created the record.
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MaintenanceCreate:
      type: object
      additionalProperties: false
      required: [machine_id, title]
      properties:
        machine_id:
          type: string
          example: FD001-E047
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        action:
          type: string
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        scheduled_at:
          type: string
          format: date-time

    MaintenanceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        action:
          type: string
        status:
          $ref: "#/components/schemas/MaintenanceStatus"
        scheduled_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    MaintenanceListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceRecord"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Alert:
      type: object
      additionalProperties: false
      required: [alert_id, machine_id, alert_type, severity, message, status, created_at]
      properties:
        alert_id:
          type: integer
          format: int64
          minimum: 1
        machine_id:
          type: string
          example: FD001-E047
        prediction_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        alert_type:
          type: string
          example: RISK_HIGH
        severity:
          $ref: "#/components/schemas/RiskLevel"
        message:
          type: string
        status:
          $ref: "#/components/schemas/AlertStatus"
        assigned_to:
          type: string
          format: uuid
          nullable: true
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AlertUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [ACKNOWLEDGED, RESOLVED]
        assigned_to:
          type: string
          format: uuid
          nullable: true
          description: User id to assign the alert to; null removes the assignment.

    AlertListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        machine_id:
          type: string
          example: FD001-E047
          description: Optional machine the question is about.
        session_id:
          type: string
          format: uuid
          description: Existing chat session; a new session is created if omitted.

    ChatSource:
      type: object
      additionalProperties: false
      required: [document_id, title, source]
      properties:
        document_id:
          type: string
          format: uuid
        title:
          type: string
        source:
          type: string
        source_url:
          type: string
          nullable: true
        chunk_index:
          type: integer
          minimum: 0

    ChatResponse:
      type: object
      additionalProperties: false
      required: [session_id, answer, sources, disclaimer, generated_at]
      properties:
        session_id:
          type: string
          format: uuid
        answer:
          type: string
        sources:
          type: array
          description: Retrieved knowledge passages the answer is grounded in.
          items:
            $ref: "#/components/schemas/ChatSource"
        machine_id:
          type: string
          example: FD001-E047
          description: Machine whose Health Summary was used, if any.
        cycle:
          type: integer
          minimum: 1
          description: Cycle of the Health Summary that was used, if any.
        disclaimer:
          type: string
          example: >-
            This is research-oriented decision support based on simulated
            C-MAPSS data and retrieved technical knowledge.
        generated_at:
          type: string
          format: date-time

    ChatSession:
      type: object
      additionalProperties: false
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
          format: uuid
        machine_id:
          type: string
          nullable: true
          example: FD001-E047
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatSessionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatSession"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    IngestionStatus:
      type: string
      enum: [PENDING, INGESTED, FAILED]

    User:
      type: object
      additionalProperties: false
      required: [user_id, name, email, role, is_active, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
        role:
          $ref: "#/components/schemas/UserRole"

    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        password:
          type: string
          format: password
          minLength: 10

    UserListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    ThresholdConfig:
      type: object
      additionalProperties: false
      required:
        - version
        - horizon_cycles
        - high_rul_max
        - medium_rul_max
        - high_probability_min
        - medium_probability_min
        - alert_rul_threshold
        - is_active
        - created_at
      properties:
        version:
          type: string
          example: cfg-1
        horizon_cycles:
          type: integer
          minimum: 1
          description: Horizon N for the probability P(RUL <= N).
        high_rul_max:
          type: integer
          minimum: 0
          description: HIGH when predicted RUL is at or below this value.
        medium_rul_max:
          type: integer
          minimum: 0
          description: MEDIUM when predicted RUL is at or below this value.
        high_probability_min:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1
        medium_probability_min:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1
        alert_rul_threshold:
          type: integer
          minimum: 0
          description: An RUL_BELOW_THRESHOLD alert is created at or below this RUL.
        is_active:
          type: boolean
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    ThresholdConfigCreate:
      type: object
      additionalProperties: false
      description: >
        high_rul_max must be smaller than medium_rul_max, and
        medium_probability_min smaller than high_probability_min.
      required:
        - version
        - horizon_cycles
        - high_rul_max
        - medium_rul_max
        - high_probability_min
        - medium_probability_min
        - alert_rul_threshold
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 50
          example: cfg-2
        horizon_cycles:
          type: integer
          minimum: 1
        high_rul_max:
          type: integer
          minimum: 0
        medium_rul_max:
          type: integer
          minimum: 0
        high_probability_min:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1
        medium_probability_min:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1
        alert_rul_threshold:
          type: integer
          minimum: 0

    ThresholdConfigListResponse:
      type: object
      additionalProperties: false
      required: [items, active_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdConfig"
        active_version:
          type: string
          example: cfg-1

    ModelVersion:
      type: object
      additionalProperties: false
      required: [model_version_id, model_name, model_type, dataset_id, version, is_active, created_at]
      properties:
        model_version_id:
          type: string
          format: uuid
        model_name:
          type: string
          example: xgboost-rul-fd001
        model_type:
          type: string
          example: XGBoost
        dataset_id:
          $ref: "#/components/schemas/DatasetId"
        version:
          type: string
          example: v3
        feature_version:
          type: string
          nullable: true
        preprocessing_version:
          type: string
          nullable: true
        calibration_version:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ModelVersionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelVersion"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    KnowledgeDocument:
      type: object
      additionalProperties: false
      required: [document_id, title, source, ingestion_status, created_at]
      properties:
        document_id:
          type: string
          format: uuid
        title:
          type: string
        source:
          type: string
        source_url:
          type: string
          nullable: true
        document_type:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ingestion_status:
          $ref: "#/components/schemas/IngestionStatus"
        created_at:
          type: string
          format: date-time

    KnowledgeDocumentUpload:
      type: object
      required: [file, title, source]
      properties:
        file:
          type: string
          format: binary
        title:
          type: string
          maxLength: 300
        source:
          type: string
          maxLength: 200
        source_url:
          type: string
        document_type:
          type: string
          maxLength: 100
        description:
          type: string

    KnowledgeDocumentListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocument"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    FleetDatasetSummary:
      type: object
      additionalProperties: false
      required: [dataset_id, machine_count, risk_counts]
      properties:
        dataset_id:
          $ref: "#/components/schemas/DatasetId"
        machine_count:
          type: integer
          minimum: 0
        risk_counts:
          type: object
          additionalProperties: false
          required: [LOW, MEDIUM, HIGH]
          properties:
            LOW:
              type: integer
              minimum: 0
            MEDIUM:
              type: integer
              minimum: 0
            HIGH:
              type: integer
              minimum: 0
        rul_min:
          type: number
          minimum: 0
        rul_mean:
          type: number
          minimum: 0
        rul_max:
          type: number
          minimum: 0

    FleetReport:
      type: object
      additionalProperties: false
      required: [generated_at, thresholds_version, datasets, open_alerts, high_risk_machines]
      properties:
        generated_at:
          type: string
          format: date-time
        thresholds_version:
          type: string
          example: cfg-1
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/FleetDatasetSummary"
        open_alerts:
          type: integer
          minimum: 0
        high_risk_machines:
          type: array
          description: Highest-risk machines, lowest predicted RUL first.
          items:
            $ref: "#/components/schemas/RiskSummaryItem"

    EndpointMetrics:
      type: object
      additionalProperties: false
      required: [method, path, request_count, error_count]
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /machines/{machine_id}
        request_count:
          type: integer
          minimum: 0
        error_count:
          type: integer
          minimum: 0
          description: Responses with status 5xx.
        latency_p95_ms:
          type: number
          minimum: 0

    OperationalMetrics:
      type: object
      additionalProperties: false
      required: [started_at, uptime_seconds, requests_total, errors_total, latency_ms]
      properties:
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0
        requests_total:
          type: integer
          minimum: 0
        errors_total:
          type: integer
          minimum: 0
          description: Responses with status 5xx.
        latency_ms:
          type: object
          additionalProperties: false
          required: [p50, p95, p99]
          properties:
            p50:
              type: number
              minimum: 0
            p95:
              type: number
              minimum: 0
            p99:
              type: number
              minimum: 0
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointMetrics"

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: NOT_FOUND
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested machine or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing data (for example a duplicate email or document)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user's role is not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >
        A required service is unavailable (for example the model, the
        database or the LLM provider)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"