# Local development database.
# Copy .env.example to .env before running: docker compose up -d --wait
#
# On the FIRST start (empty volume) PostgreSQL runs the SQL files mounted into
# /docker-entrypoint-initdb.d in alphabetical order: schema, then seed.
# These scripts do NOT run again when the volume already holds data. To rebuild
# the database from scratch (this deletes all local data):
#   docker compose down -v
#   docker compose up -d --wait

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: predictive-maintenance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictive_maintenance}
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}

    ports:
      # Published on the local machine only.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/database-schema-v0.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Development sample data. Remove this line once real seeding exists.
      - ./docs/database/seed-v0.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      # -h 127.0.0.1 forces a TCP check. During first-time initialisation
      # PostgreSQL runs a temporary server that only listens on a socket, so a
      # socket check would report "healthy" before the schema has been loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: